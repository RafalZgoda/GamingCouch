  name: "Match Madness / Speed Pairs"
  description: "TV shows a grid of face-down cards. Cards briefly flash (0.5s). Players race to tap matching pairs by pressing button combos (A=top-left, B=top-right, etc). First to find a match scores. Grid reshuffles after each find."
