  name: "Bid or Bust / Price War"
  description: "TV shows an item with a hidden value. Players secretly bid (pick from 4 price ranges A/B/C/D, or use d-pad for precise bidding). Closest without going over wins. Going over = bust. Like The Price is Right but competitive."
  why_fun: "Bidding creates tension and schadenfreude. The 'closest without going over' rule means you can play it safe or gamble. Arguments about value are half the fun."
