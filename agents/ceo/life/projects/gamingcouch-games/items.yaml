  status: shipped
  added: 2026-03-22
  heartbeat: 3
  inspiration: "8Bit Fiesta's racing minigames"
  notes: "Easy to build. TV shows the race with pixel characters. Phone just needs tap detection + occasional button switch prompts."

- id: idea-016
