- id: idea-018
  name: "Target Tap / Whack-a-Mole"
  description: "TV shows a 2x2 grid with targets popping up in different quadrants. Each quadrant maps to A/B/C/D. Tap the right button when a target appears in that quadrant. Score based on speed and accuracy."
