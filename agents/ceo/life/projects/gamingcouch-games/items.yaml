# Gap: no word association/clue-giving, no estimation/bidding, no speed-matching/pattern games.

- id: idea-036
  name: "Codeword / One-Word Clue"
  description: "TV shows 8 words in a grid. One 'clue-giver' player sees which 4 belong to their team. They type a one-word clue + number on their phone. Other players tap words they think match. Like Codenames but simplified for phone controls."
  why_fun: "Codenames is one of the best party games ever made. The 'one clue to link multiple words' mechanic creates brilliant moments and spectacular failures. Very social."
