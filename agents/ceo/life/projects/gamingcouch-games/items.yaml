- id: idea-048
  name: "Category Sprint"
  description: "TV shows a category (e.g. 'Countries in Europe'). Each round, 4 options appear — players race to tap valid answers. Wrong tap = freeze for 2s. Most correct answers in 30s wins."
  why_fun: "Speed + knowledge combo. Categories rotate so no one dominates. Freeze penalty creates drama — you see others scoring while you're stuck."
  complexity: low
  status: shipped
  added: 2026-03-25
  heartbeat: 13
  notes: "4-button format. Needs category + answer database. Simple timer + validation logic. Good variety from pure reaction games."

- id: idea-049
  name: "Auction House / Bid War"
  description: "TV shows mystery items with hints. Players bid using buttons (A=100, B=200, C=500, D=1000). Highest unique bid wins. If tied, both lose. Strategy: bid high enough to win but not so high you lose points."
  why_fun: "Game theory in a party setting. The 'unique bid' twist means you have to outthink others, not just bid highest. Mind games and bluffing."
  complexity: low
  status: shipped
  added: 2026-03-25
  heartbeat: 13
  notes: "4-button bidding. Unique bid mechanic is novel. Could reveal bids dramatically one by one. Needs item/hint database."

- id: idea-050
  name: "Freeze Dance / Musical Statues"
  description: "TV plays music with a visual beat indicator. Players tap along to the rhythm. Music randomly stops — if you tap during silence, you're out. Last player standing wins."
