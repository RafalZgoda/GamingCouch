# --- Heartbeat 7: Asymmetric, creative, and reflex gaps (2026-03-22) ---
# Gap: no asymmetric roles, no creative/drawing, no "press when you see X" reflex variant.

- id: idea-030
  name: "Spy / Odd One Out"
  description: "All players get the same secret word on their phone EXCEPT one spy who gets a different word. TV shows a category hint. Players take turns answering a question about it. Then everyone votes who they think the spy is. Spy scores if they survive + guess the real word."
  why_fun: "Social deduction with bluffing. The spy sweats trying to blend in. Voting rounds get heated. Proven mechanic (Spyfall)."
  complexity: medium
  status: idea
  added: 2026-03-22
  heartbeat: 7
  notes: "Asymmetric gameplay — first game where one player has a different role. Uses button voting (A/B/C/D = player names). Needs word pair database (real word vs spy word in same category)."

- id: idea-031
  name: "Doodle Dash"
  description: "TV shows a word. All players draw it simultaneously on their phone (finger = pen). After 15s, all drawings appear on TV. Players vote for the best/funniest. Points for votes received."
  why_fun: "Bad drawings are universally hilarious. Competitive creativity with a timer. Gets people laughing at each other's art."
  complexity: high
  status: idea
  added: 2026-03-22
  heartbeat: 7
  notes: "Needs a drawing canvas controller type (new). Phone captures touch path as strokes, sends to server, TV renders all drawings. High complexity but high payoff. Voting round uses existing buttons."

- id: idea-032
  name: "Color Flash / Don't Tap"
  description: "TV flashes a sequence of colored circles rapidly. Players must tap ONLY when their assigned color appears, and NOT tap on any other color. Tapping wrong = penalty. Missing your color = penalty. Speed increases each round."
  why_fun: "Reflex + restraint. The 'don't tap' rule creates hilarious false taps. Gets frantic at high speed. Simple to learn, hard to master."
  complexity: low
  status: shipped
  added: 2026-03-22
  heartbeat: 7
  notes: "Uses single button controller. Each player is assigned a color at round start. TV flashes colors at increasing speed. Novel twist on reaction games — tests restraint, not just speed."

