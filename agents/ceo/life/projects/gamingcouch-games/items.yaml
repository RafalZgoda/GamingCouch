- id: idea-017
  name: "Bomb Defuse / Wire Cut"
  description: "TV shows a ticking bomb with 4 colored wires (A/B/C/D). One random wire is correct. All players must pick simultaneously. Wrong wire = explosion animation + penalty. Right wire = points. Gets faster each round."
