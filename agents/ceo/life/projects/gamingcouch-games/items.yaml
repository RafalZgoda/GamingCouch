- id: idea-019
  name: "Floor is Lava / Platform Jump"
  description: "TV shows platforms labeled A/B/C/D. Lava rises from below. A safe platform is highlighted briefly, players must press that button to jump there. Wrong platform or too slow = fall in lava. Elimination rounds."
  why_fun: "Visual spectacle on TV + elimination drama. Directly inspired by 8BF's platformer/lava mechanics but works with our 4-button controller."
  complexity: low
  status: shipped
  added: 2026-03-22
  heartbeat: 3
  inspiration: "8Bit Fiesta's Lava Dodge, precision platforming, and elimination format"
  notes: "Perfect 4-button mapping. Can have fun pixel art lava + character animations. Each round gets faster."

- id: idea-020
  name: "Copycat Chain"
  description: "First player presses a button. Next player must repeat it and add one. Chain grows. Miss a beat = eliminated. Like Simon Says but competitive and social."
  why_fun: "Memory + pressure + everyone watching. Classic mechanic that 8BF proves works in party context."
  complexity: low
  status: shipped
  added: 2026-03-22
  heartbeat: 3
