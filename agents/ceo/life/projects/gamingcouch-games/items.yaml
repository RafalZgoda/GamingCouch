# --- Heartbeat 12: Debate, deception, and priority pass (2026-03-23) ---
# Gap: no debate/argument format, no "catch the liar" mechanic. Also adding a priority ranking of top buildable ideas.

- id: idea-045
  name: "Debate Club / Hot Take"
  description: "TV shows a spicy opinion (e.g. 'Pineapple belongs on pizza'). Players vote AGREE or DISAGREE (2 buttons). Then the minority must defend their position — TV gives them 15 seconds. After the defense, everyone revotes. Points for changing minds."
  why_fun: "Forces people to argue for positions they may not even believe. The 15-second defense creates hilarious improvised speeches. Social energy through the roof."
  complexity: low
  status: shipped
  added: 2026-03-23
  heartbeat: 12
  notes: "2 buttons (agree/disagree). Needs statement database. Voting + timer is trivial. The social pressure does all the work. Great for groups who like to argue."

- id: idea-046
  name: "Fact or Cap / Catch the Liar"
  description: "One player sees a true fact on their phone. They can tell it truthfully OR make up a lie. They type/select their version. TV shows what they said. Others vote FACT or CAP (truth or lie). Points for fooling people or catching liars."
  why_fun: "Bluffing + detection. People's poker faces get tested. The reveal moment ('That was actually TRUE') is always dramatic. Social deduction at its simplest."
  complexity: low
  status: shipped
  added: 2026-03-23
  heartbeat: 12
  notes: "Asymmetric: one presenter, others are judges. 2 buttons for voting. Needs a database of surprising-but-true facts. Could use text input for custom lies or pick-from-4 for simplified version."

- id: idea-047
  name: "Shake It / Phone Tilt"
  description: "Players tilt or shake their phone as instructed by TV ('Tilt LEFT!', 'Shake!'). Phone accelerometer detects motion. Fastest correct response scores. Wrong motion = penalty. Gets faster each round."
  why_fun: "Physical phone interaction — people waving phones around is inherently funny. Uses a sensor most party games ignore. Gets people moving without leaving the couch."
  complexity: high
  status: idea
  added: 2026-03-23
  heartbeat: 12
  notes: "Needs DeviceMotion API access. May require HTTPS + user permission. High complexity due to sensor calibration. But unique differentiator — no competitor does this well."

