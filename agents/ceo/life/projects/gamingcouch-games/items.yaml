# GamingCouch Game Ideas — Brainstorm Log
# Each heartbeat adds new ideas. Status: idea | approved | in_dev | shipped | rejected

- id: idea-001
  name: "Draw & Guess (Pictionary-style)"
  description: "One player draws on their phone (finger on screen), others guess from 4 text options on TV. Hilarious bad drawings. Timer pressure."
  why_fun: "Bad drawings are universally funny. Low skill floor, everyone can play."
  complexity: medium
  status: idea
  added: 2026-03-22
  notes: "Would need a drawing canvas on phone — goes beyond 4-button controller. May need a 'free draw' controller layout."

- id: idea-002
  name: "Bluff / Two Truths One Lie"
  description: "TV shows 3 statements (submitted by one player or AI-generated). Others vote A/B/C for which is the lie. Points for fooling people & for guessing right."
  why_fun: "Social deduction, sparks conversation, people learn about each other."
  complexity: low
  status: shipped
  added: 2026-03-22
  notes: "Pure 4-button works (A/B/C to vote). Could use pre-written prompts or let players type on phone."

- id: idea-003
  name: "Sound Guess"
  description: "TV plays a sound effect or song clip. Players pick from 4 options what it is. Categories: movie quotes, animal sounds, songs, everyday noises."
  why_fun: "Audio-based variety. Funny when someone confuses a cat with a baby crying."
  complexity: medium
  status: shipped
  added: 2026-03-22
  notes: "Needs audio asset library. Could crowdsource or use royalty-free sounds."

- id: idea-004
  name: "Speed Typer / Word Scramble"
  description: "TV shows scrambled letters. First to unscramble and tap the right answer (4 options) wins the round. Gets harder each round."
  why_fun: "Competitive word puzzles with time pressure. Accessible to anyone who can read."
  complexity: low
  status: idea
  added: 2026-03-22
  notes: "Fits perfectly in the 4-button/4-option format. Easy to implement."

- id: idea-005
  name: "Would You Rather"
  description: "TV shows a 'Would you rather' dilemma (A or B). Everyone votes. Majority wins points. Minority gets bonus if they can survive 3 rounds in a row as minority."
  why_fun: "Sparks debates and laughs. Reveals personality. Zero skill barrier."
  complexity: low
  status: shipped
  added: 2026-03-22
  notes: "Only needs 2 buttons (A/B). Very easy to build. Great ice-breaker game."

- id: idea-006
  name: "Emoji Charades"
  description: "One player sees a movie/song/phrase on their phone. They pick from emojis to describe it (shown on TV). Others guess from 4 text options."
  why_fun: "Creative emoji combinations are hilarious. Modern twist on charades."
  complexity: medium
  status: idea
  added: 2026-03-22
  notes: "Phone player needs emoji selection UI. Others use standard 4-button."

- id: idea-007
  name: "Hot Potato / Bomb Pass"
  description: "A virtual bomb ticks on TV. Random trivia or challenge appears. Answer correctly to pass the bomb to next player. Wrong answer = you hold it. Bomb explodes = you lose a life."
  why_fun: "Tension + pressure + schadenfreude when someone explodes. Classic party mechanic."
  complexity: medium
  status: idea
  added: 2026-03-22
  notes: "Adds elimination/lives mechanic. Good variety from pure scoring games."

- id: idea-008
  name: "Copycat / Simon Says"
  description: "TV shows a sequence of button presses (colors/directions). Players must repeat it on their phone. Sequence grows each round. Last player standing wins."
  why_fun: "Simple memory game, gets tense as sequences grow. Everyone knows how to play."
  complexity: low
  status: shipped
  added: 2026-03-22
  notes: "Perfect fit for 4-button controller. Classic game mechanic."

- id: idea-009
  name: "Price is Right / Guess the Number"
  description: "TV shows an item (product, celebrity age, distance, etc). Players pick from 4 price/number ranges. Closest range wins. Could also do 'higher or lower' variant."
  why_fun: "People are hilariously bad at estimating. Easy to argue about."
  complexity: low
  status: shipped
  added: 2026-03-22
  notes: "Needs a content database of items+values. 4-button works perfectly."

- id: idea-010
  name: "Rhythm Tap"
  description: "Music plays, beats are shown on TV like a simplified rhythm game. Players tap buttons in time. Score based on accuracy and timing."
  why_fun: "Musical, energetic, gets people moving. Works for all skill levels with easy songs."
  complexity: high
  status: idea
  added: 2026-03-22
  notes: "Needs audio sync and beat mapping. Higher complexity but high reward."

- id: idea-011
  name: "Spot the Difference"
  description: "TV shows two nearly identical images side by side. Each difference is labeled A/B/C/D with zones. Players race to tap which zone has a difference. Multiple rounds with increasing subtlety."
  why_fun: "Visual puzzle everyone understands. Competitive race element. Gets surprisingly heated."
  complexity: low
  status: shipped
  added: 2026-03-22
  heartbeat: 2
  notes: "Needs image pairs with known differences. Could generate programmatically or curate. 4-button maps to quadrants."

- id: idea-012
  name: "Story Builder / Consequences"
  description: "Players take turns adding to a story. Each turn, player picks from 4 AI-generated continuation options (A/B/C/D). Story builds on TV. Funniest/weirdest story wins by group vote at end."
  why_fun: "Collaborative absurdity. Stories go off the rails in hilarious ways. No wrong answers."
  complexity: medium
  status: idea
  added: 2026-03-22
  heartbeat: 2
  notes: "Could use AI to generate continuation options based on story so far. Voting round at end for best story moment."

- id: idea-013
  name: "Mime Time / Act It Out"
  description: "One player's phone shows a word/phrase. They physically act it out (no talking). Others watch and pick from 4 options on their phone. Timer adds pressure."
  why_fun: "Gets people off the couch and moving. Physical comedy is universally funny. Classic party game digitized."
  complexity: low
  status: shipped
  added: 2026-03-22
  heartbeat: 2
  notes: "Minimal tech needed — phone just shows the prompt to the actor, others vote via 4 buttons. Word database needed."

